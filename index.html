<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b3a2b">
  <title>SCC-CI-SCOOPS — V2 Premium Multi-années</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="toast" class="toast"></div>

<section id="loginView" class="login-shell">
  <div class="login-card">
    <div class="brand">
      <div class="brand-mark">SC</div>
      <div><h1>SCC-CI-SCOOPS</h1><p>Gestion coopérative — V2 Premium</p></div>
    </div>
    <span class="secure">● Accès sécurisé</span>
    <h2>Connexion</h2>
    <p class="muted">Connectez-vous avec votre compte SCC-CI-SCOOPS.</p>
    <form id="loginForm">
      <label>Email<input id="loginEmail" type="email" required autocomplete="email"></label>
      <label>Mot de passe<input id="loginPassword" type="password" required autocomplete="current-password"></label>
      <button class="btn primary wide">Se connecter</button>
    </form>
    <p id="loginStatus" class="muted"></p>
  </div>
</section>

<div id="appView" class="app hidden">
  <aside class="sidebar" id="sidebar">
    <div class="brand compact">
      <div class="brand-mark">SC</div>
      <div><strong>SCC-CI-SCOOPS</strong><small id="roleLabel">—</small></div>
    </div>

    <div class="selector-card">
      <small>ACTIVITÉ</small>
      <select id="activitySelect"></select>
      <small style="margin-top:10px">EXERCICE / ANNÉE</small>
      <select id="yearSelect"></select>
    </div>

    <nav id="nav"></nav>

    <div class="side-footer">
      <div><strong id="userName">Utilisateur</strong><small id="userEmail"></small></div>
      <button id="logoutBtn" class="btn ghost wide">Déconnexion</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button id="menuBtn" class="icon-btn">☰</button>
      <div>
        <span class="eyebrow">SCC-CI-SCOOPS • PILOTAGE</span>
        <h1 id="pageTitle">Tableau de bord</h1>
        <p id="pageSubtitle">Vue générale</p>
      </div>
      <div class="top-actions">
        <span id="syncBadge" class="badge ok">● En ligne</span>
        <span id="todayLabel"></span>
      </div>
    </header>
    <section id="content" class="content"></section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
