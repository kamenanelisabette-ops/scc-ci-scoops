<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f3d2e" />
  <title>SCC-CI-SCOOPS — Gestion Coopérative</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="toast" class="toast"></div>

  <section id="loginView" class="login-shell">
    <div class="login-card">
      <div class="brand-row"><div class="brand-mark">SC</div><div><h1>SCC-CI-SCOOPS</h1><p>Gestion de la coopérative — Daloa</p></div></div>
      <h2>Connexion sécurisée</h2>
      <p class="muted">Connectez-vous avec votre compte utilisateur SCC-CI-SCOOPS.</p>
      <form id="loginForm">
        <label>Email<input id="loginEmail" type="email" autocomplete="email" required placeholder="nom@exemple.com" /></label>
        <label>Mot de passe<input id="loginPassword" type="password" autocomplete="current-password" required placeholder="••••••••" /></label>
        <button class="btn primary" type="submit">Se connecter</button>
      </form>
      <div id="loginStatus" class="status"></div>
      <p class="tiny">Base de données : Supabase • Accès protégé par rôles</p>
    </div>
  </section>

  <div id="appView" class="app-shell hidden">
    <aside class="sidebar" id="sidebar">
      <div class="brand-row compact"><div class="brand-mark">SC</div><div><strong>SCC-CI-SCOOPS</strong><small id="roleLabel">—</small></div></div>
      <nav id="nav"></nav>
      <div class="sidebar-footer">
        <div class="user-chip"><span id="userName">Utilisateur</span><small id="userEmail"></small></div>
        <button id="logoutBtn" class="btn ghost">Déconnexion</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn">☰</button>
        <div><h1 id="pageTitle">Tableau de bord</h1><p id="pageSubtitle">Pilotage SCC-CI-SCOOPS</p></div>
        <div class="top-actions"><span id="syncBadge" class="badge ok">● En ligne</span><span id="todayLabel"></span></div>
      </header>
      <section id="content" class="content"></section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
